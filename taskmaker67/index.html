<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FocusCraft - Productivity & Task Visualizer</title>
  
  <!-- Tailwind CSS CDN for modern responsive UI -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@300;400;500;600;700&family=Poppins:wght@300;400;500;600;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --primary-color: #4f46e5;
      --primary-hover: #4338ca;
    }

    body {
      font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
      transition: background-image 0.3s ease, font-family 0.3s ease;
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }

    .theme-bg {
      background-color: var(--primary-color);
    }

    .theme-text {
      color: var(--primary-color);
    }

    .theme-border {
      border-color: var(--primary-color);
    }

    .btn-primary {
      background-color: var(--primary-color);
      color: white;
      transition: all 0.2s ease-in-out;
    }

    .btn-primary:hover {
      filter: brightness(0.9);
      transform: translateY(-1px);
    }

    /* GitHub Button Styling */
    .btn-github {
      background-color: #24292f;
      color: white;
      transition: all 0.2s ease-in-out;
    }

    .btn-github:hover {
      background-color: #1b1f23;
      transform: translateY(-1px);
    }

    .btn-github:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    /* Alert Styling */
    .alert {
      padding: 0.75rem 1rem;
      border-radius: 0.5rem;
      font-size: 0.875rem;
      font-weight: 500;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .alert-error {
      background-color: #fef2f2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }

    .alert-success {
      background-color: #f0fdf4;
      color: #166534;
      border: 1px solid #bbf7d0;
    }

    /* Glassmorphism Card Style */
    .glass-card {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.4);
    }

    /* Custom scrollbars */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.05);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(0, 0, 0, 0.2);
      border-radius: 4px;
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 flex flex-col antialiased">

  <header id="nav-bar" class="hidden sticky top-0 z-50 bg-white/90 backdrop-blur-md border-b border-slate-200 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      
      <!-- Brand Logo & Home Navigation -->
      <div class="flex items-center gap-3">
        <a href="../index.html" class="p-2 text-slate-500 hover:text-slate-900 hover:bg-slate-100 rounded-lg transition" title="Back to Main Homepage">
          <i data-lucide="arrow-left" class="w-5 h-5"></i>
        </a>
        <div class="flex items-center gap-2 cursor-pointer" id="nav-dashboard-btn">
          <div class="w-9 h-9 rounded-xl theme-bg flex items-center justify-center text-white shadow-md">
            <i data-lucide="check-square" class="w-5 h-5"></i>
          </div>
          <span class="font-bold text-xl tracking-tight text-slate-900">Focus<span class="theme-text">Craft</span></span>
        </div>
      </div>

      <!-- Navigation Links -->
      <div class="flex items-center gap-1 sm:gap-3">
        <button id="nav-dashboard-btn-link" class="px-3 py-2 text-sm font-semibold text-slate-700 hover:text-slate-900 rounded-lg hover:bg-slate-100 transition flex items-center gap-1.5">
          <i data-lucide="layout-dashboard" class="w-4 h-4"></i>
          <span class="hidden sm:inline">Dashboard</span>
        </button>
        <button id="nav-archive-btn" class="px-3 py-2 text-sm font-semibold text-slate-700 hover:text-slate-900 rounded-lg hover:bg-slate-100 transition flex items-center gap-1.5">
          <i data-lucide="archive" class="w-4 h-4"></i>
          <span class="hidden sm:inline">Archive</span>
        </button>
        <button id="nav-password-btn" class="px-3 py-2 text-sm font-semibold text-slate-700 hover:text-slate-900 rounded-lg hover:bg-slate-100 transition flex items-center gap-1.5">
          <i data-lucide="key-round" class="w-4 h-4"></i>
          <span class="hidden sm:inline">Security</span>
        </button>
      </div>

      <!-- User Profile & Logout -->
      <div class="flex items-center gap-3">
        <div class="flex items-center gap-2 bg-slate-100 px-3 py-1.5 rounded-full border border-slate-200">
          <div class="w-6 h-6 rounded-full theme-bg text-white text-xs flex items-center justify-center font-bold overflow-hidden">
            <img id="user-avatar" src="" alt="Profile picture" class="hidden w-6 h-6 rounded-full object-cover">
            <span id="user-avatar-fallback" class="flex items-center justify-center">
              <i data-lucide="user" class="w-3.5 h-3.5"></i>
            </span>
          </div>
          <span id="user-display-name" class="text-xs font-semibold text-slate-700 truncate max-w-[120px]">User</span>
        </div>
        <button id="sign-out-btn" class="p-2 text-slate-500 hover:text-red-600 hover:bg-red-50 rounded-lg transition" title="Sign Out">
          <i data-lucide="log-out" class="w-5 h-5"></i>
        </button>
      </div>

    </div>
  </header>

  <!-- Main Workspace Container -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8 flex flex-col justify-center">

    <section id="auth-screen" class="max-w-md w-full mx-auto my-auto">
      <div class="glass-card p-8 rounded-2xl shadow-xl">

        <div class="text-center mb-6">
          <div class="w-14 h-14 theme-bg text-white rounded-2xl mx-auto flex items-center justify-center shadow-lg mb-3">
            <i data-lucide="sparkles" class="w-7 h-7"></i>
          </div>
          <h2 id="auth-title" class="text-2xl font-bold text-slate-900">Sign In to FocusCraft</h2>
          <p class="text-xs text-slate-500 mt-1">Organize your workflow, track tasks, and craft focus.</p>
        </div>

        <div id="auth-alert" class="alert hidden"></div>

        <!-- Main option: GitHub -->
        <button type="button" id="github-login-btn" class="w-full py-3 rounded-lg font-semibold btn-github text-sm shadow-md flex items-center justify-center gap-2">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.1.79-.25.79-.56v-2c-3.2.7-3.87-1.37-3.87-1.37-.52-1.33-1.28-1.69-1.28-1.69-1.04-.71.08-.7.08-.7 1.15.08 1.76 1.18 1.76 1.18 1.03 1.76 2.69 1.25 3.35.96.1-.74.4-1.25.73-1.54-2.55-.29-5.24-1.28-5.24-5.69 0-1.26.45-2.28 1.18-3.09-.12-.29-.51-1.46.11-3.05 0 0 .97-.31 3.17 1.18a11 11 0 0 1 5.78 0c2.2-1.49 3.17-1.18 3.17-1.18.62 1.59.23 2.76.11 3.05.74.81 1.18 1.83 1.18 3.09 0 4.42-2.69 5.39-5.25 5.68.41.36.78 1.06.78 2.14v3.17c0 .31.21.67.8.56A11.5 11.5 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5z"/>
          </svg>
          <span>Continue with GitHub</span>
        </button>

        <div class="flex items-center gap-3 my-5">
          <div class="flex-1 h-px bg-slate-300/70"></div>
          <span class="text-xs font-semibold uppercase tracking-wider text-slate-500">or use email</span>
          <div class="flex-1 h-px bg-slate-300/70"></div>
        </div>

        <form id="auth-form" class="space-y-4">
          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Email Address</label>
            <input type="email" id="auth-email" required placeholder="you@example.com" class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm transition">
          </div>

          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Password</label>
            <input type="password" id="auth-password" required placeholder="••••••••" class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm transition">
          </div>

          <button type="submit" id="auth-submit-btn" class="w-full py-3 rounded-lg font-semibold btn-primary text-sm shadow-md mt-2">
            Sign In
          </button>
        </form>

        <div class="mt-6 pt-6 border-t border-slate-200/80 text-center text-xs text-slate-500 flex flex-col gap-3">
          <p>
            <span id="auth-toggle-text">Don't have an account?</span>
            <button id="auth-toggle-btn" class="font-semibold theme-text hover:underline ml-1">Sign Up</button>
          </p>
        </div>

      </div>
    </section>

    <!-- Signed-in placeholder (dashboard comes in a later step) -->
    <section id="app-screen" class="hidden max-w-md w-full mx-auto my-auto">
      <div class="glass-card p-8 rounded-2xl shadow-xl text-center">
        <img id="welcome-avatar" src="" alt="Profile picture" class="hidden w-20 h-20 rounded-full object-cover mx-auto mb-4 shadow-md">
        <h2 class="text-2xl font-bold text-slate-900">Welcome, <span id="welcome-name" class="theme-text">User</span>!</h2>
        <p class="text-sm text-slate-500 mt-2">You're signed in. Your dashboard is coming next.</p>
      </div>
    </section>

  </main>

  <!-- Required Scripts Loaded in Correct Order -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    // Initialize Lucide icons
    lucide.createIcons();
  </script>
</body>
</html>
