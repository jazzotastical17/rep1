<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FocusCraft - Productivity & Task Visualizer</title>
  
  <!-- Tailwind CSS CDN for modern responsive UI -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@300;400;500;600;700&family=Poppins:wght@300;400;500;600;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --primary-color: #4f46e5;
      --primary-hover: #4338ca;
    }

    body {
      font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
      transition: background-image 0.3s ease, font-family 0.3s ease;
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }

    .theme-bg {
      background-color: var(--primary-color);
    }

    .theme-text {
      color: var(--primary-color);
    }

    .theme-border {
      border-color: var(--primary-color);
    }

    .btn-primary {
      background-color: var(--primary-color);
      color: white;
      transition: all 0.2s ease-in-out;
    }

    .btn-primary:hover {
      filter: brightness(0.9);
      transform: translateY(-1px);
    }

    /* Alert Styling */
    .alert {
      padding: 0.75rem 1rem;
      border-radius: 0.5rem;
      font-size: 0.875rem;
      font-weight: 500;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .alert-error {
      background-color: #fef2f2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }

    .alert-success {
      background-color: #f0fdf4;
      color: #166534;
      border: 1px solid #bbf7d0;
    }

    /* Glassmorphism Card Style */
    .glass-card {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.4);
    }

    /* Custom scrollbars */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.05);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(0, 0, 0, 0.2);
      border-radius: 4px;
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 flex flex-col antialiased">

  <header id="nav-bar" class="hidden sticky top-0 z-50 bg-white/90 backdrop-blur-md border-b border-slate-200 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      
      <!-- Brand Logo & Home Navigation -->
      <div class="flex items-center gap-3">
        <a href="../index.html" class="p-2 text-slate-500 hover:text-slate-900 hover:bg-slate-100 rounded-lg transition" title="Back to Main Homepage">
          <i data-lucide="arrow-left" class="w-5 h-5"></i>
        </a>
        <div class="flex items-center gap-2 cursor-pointer" id="nav-dashboard-btn">
          <div class="w-9 h-9 rounded-xl theme-bg flex items-center justify-center text-white shadow-md">
            <i data-lucide="check-square" class="w-5 h-5"></i>
          </div>
          <span class="font-bold text-xl tracking-tight text-slate-900">Focus<span class="theme-text">Craft</span></span>
        </div>
      </div>

      <!-- Navigation Links -->
      <div class="flex items-center gap-1 sm:gap-3">
        <button id="nav-dashboard-btn" class="px-3 py-2 text-sm font-semibold text-slate-700 hover:text-slate-900 rounded-lg hover:bg-slate-100 transition flex items-center gap-1.5">
          <i data-lucide="layout-dashboard" class="w-4 h-4"></i>
          <span class="hidden sm:inline">Dashboard</span>
        </button>
        <button id="nav-archive-btn" class="px-3 py-2 text-sm font-semibold text-slate-700 hover:text-slate-900 rounded-lg hover:bg-slate-100 transition flex items-center gap-1.5">
          <i data-lucide="archive" class="w-4 h-4"></i>
          <span class="hidden sm:inline">Archive</span>
        </button>
        <button id="nav-password-btn" class="px-3 py-2 text-sm font-semibold text-slate-700 hover:text-slate-900 rounded-lg hover:bg-slate-100 transition flex items-center gap-1.5">
          <i data-lucide="key-round" class="w-4 h-4"></i>
          <span class="hidden sm:inline">Security</span>
        </button>
      </div>

      <!-- User Profile & Logout -->
      <div class="flex items-center gap-3">
        <div class="flex items-center gap-2 bg-slate-100 px-3 py-1.5 rounded-full border border-slate-200">
          <div class="w-6 h-6 rounded-full theme-bg text-white text-xs flex items-center justify-center font-bold">
            <i data-lucide="user" class="w-3.5 h-3.5"></i>
          </div>
          <span id="user-display-name" class="text-xs font-semibold text-slate-700 truncate max-w-[120px]">User</span>
        </div>
        <button id="sign-out-btn" class="p-2 text-slate-500 hover:text-red-600 hover:bg-red-50 rounded-lg transition" title="Sign Out">
          <i data-lucide="log-out" class="w-5 h-5"></i>
        </button>
      </div>

    </div>
  </header>

  <!-- Main Workspace Container -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8 flex flex-col justify-center">

    <section id="auth-screen" class="max-w-md w-full mx-auto my-auto">
      <div class="glass-card p-8 rounded-2xl shadow-xl">
        
        <!-- Config Notice Banner -->
        <div class="bg-amber-50 border border-amber-200 text-amber-800 text-xs p-3 rounded-lg mb-4 flex items-start gap-2">
          <i data-lucide="info" class="w-4 h-4 text-amber-600 shrink-0 mt-0.5"></i>
          <div>
            <span class="font-bold block mb-0.5">Setup Required</span>
            To enable database & auth features, replace the placeholders in <code class="bg-amber-100 px-1 py-0.5 rounded font-mono">config.js</code> with your actual Supabase URL and Key.
          </div>
        </div>

        <div class="text-center mb-6">
          <div class="w-14 h-14 theme-bg text-white rounded-2xl mx-auto flex items-center justify-center shadow-lg mb-3">
            <i data-lucide="sparkles" class="w-7 h-7"></i>
          </div>
          <h2 id="auth-title" class="text-2xl font-bold text-slate-900">Sign In to FocusCraft</h2>
          <p class="text-xs text-slate-500 mt-1">Organize your workflow, track tasks, and craft focus.</p>
        </div>

        <div id="auth-alert" class="alert hidden"></div>

        <form id="auth-form" class="space-y-4">
          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Email Address</label>
            <input type="email" id="auth-email" required placeholder="you@example.com" class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm transition">
          </div>

          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Password</label>
            <input type="password" id="auth-password" required placeholder="••••••••" class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm transition
