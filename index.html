<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wolf Album Experience</title>
  <style>
    /* Styling for floating audio controls */
    .mute-btn {
      position: fixed;
      bottom: 20px;
      left: 20px;
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      border: none;
      padding: 10px 15px;
      border-radius: 50px;
      cursor: pointer;
      font-size: 16px;
      z-index: 1000;
    }

    .track-container {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: rgba(0, 0, 0, 0.85);
      color: #fff;
      padding: 15px;
      border-radius: 12px;
      font-family: Arial, sans-serif;
      text-align: center;
      z-index: 1000;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: center;
    }

    .track-title {
      font-weight: bold;
      font-size: 14px;
    }

    .song-controls {
      display: flex;
      gap: 5px;
      align-items: center;
    }

    .song-controls button, .song-controls select {
      background: #333;
      color: #fff;
      border: 1px solid #555;
      padding: 5px 8px;
      border-radius: 5px;
      cursor: pointer;
    }

    .game-link {
      display: inline-block;
      margin-top: 5px;
      color: #1DB954;
      text-decoration: none;
      font-weight: bold;
      font-size: 13px;
      border: 1px solid #1DB954;
      padding: 5px 10px;
      border-radius: 20px;
      transition: all 0.2s ease;
    }

    .game-link:hover {
      background-color: #1DB954;
      color: #000;
    }
  </style>
</head>
<body>

  <!-- Background Audio Player -->
  <audio id="album-audio" loop>
    <source src="audio.mp3" type="audio/mpeg">
    Your browser does not support the audio element.
  </audio>

  <!-- Mute/Play Toggle (Bottom-Left) -->
  <button id="mute-btn" class="mute-btn">🎵 Unmute</button>

  <!-- Track Info and Song Switcher (Bottom-Right) -->
  <div class="track-container">
    <div id="track-title" class="track-title">WOLF</div>
    <div class="song-controls">
      <button id="prev-btn">⏮</button>
      <select id="song-select"></select>
      <button id="next-btn">⏭</button>
    </div>
    
    <!-- Link to your game -->
    <a href="froyo/index.html" class="game-link">🎮 Play My Game</a>
  </div>

  <script>
    const tracks = [
      { name: "WOLF", start: 0 },
      { name: "Jamba (feat. Hodgy)", start: 110 },
      { name: "Cowboy", start: 260 },
      { name: "Awkward", start: 455 },
      { name: "Domo23", start: 675 },
      { name: "Answer", start: 834 },
      { name: "Slater (feat. Frank Ocean)", start: 1125 },
      { name: "48", start: 1360 },
      { name: "Colossus", start: 1607 },
      { name: "PartyIsOver/Campfire/Bimmer", start: 1842 },
      { name: "IFHY (feat. Pharrell)", start: 2163 },
      { name: "Pigs", start: 2482 },
      { name: "Parking Lot (feat. Casey Veggies & Mike G)", start: 2796 },
      { name: "Rusty (feat. Domo Genesis & Earl Sweatshirt)", start: 3020 },
      { name: "Trashwang (feat. Na'kel, Jasper, Lucas, L-Boy, Taco, Left Brain & Lee Spielman)", start: 3329 },
      { name: "Treehome95 (feat. Coco O. & Erykah Badu)", start: 3671 },
      { name: "Lone", start: 3852 }
    ];

    const audio = document.getElementById('album-audio');
    const muteBtn = document.getElementById('mute-btn');
    const trackTitle = document.getElementById('track-title');
    const songSelect = document.getElementById('song-select');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');

    // Populate dropdown
    tracks.forEach((track, index) => {
      const option = document.createElement('option');
      option.value = index;
      option.textContent = `${index + 1}. ${track.name}`;
      songSelect.appendChild(option);
    });

    // Mute / Play toggle
    muteBtn.addEventListener('click', () => {
      if (audio.paused) {
        audio.play();
        muteBtn.textContent = '🔊 Mute';
      } else {
        audio.muted = !audio.muted;
        muteBtn.textContent = audio.muted ? '🎵 Unmute' : '🔊 Mute';
      }
    });

    // Live track sync based on playback time
    audio.addEventListener('timeupdate', () => {
      const currentTime = audio.currentTime;
      let currentTrackIndex = 0;

      for (let i = tracks.length - 1; i >= 0; i--) {
        if (currentTime >= tracks[i].start) {
          currentTrackIndex = i;
          break;
        }
      }

      trackTitle.textContent = tracks[currentTrackIndex].name;
      songSelect.value = currentTrackIndex;
    });

    // Dropdown track selection
    songSelect.addEventListener('change', (e) => {
      const selectedIndex = e.target.value;
      audio.currentTime = tracks[selectedIndex].start;
      if (audio.paused) audio.play();
    });

    // Previous button
    prevBtn.addEventListener('click', () => {
      let currentIndex = parseInt(songSelect.value);
      if (currentIndex > 0) {
        audio.currentTime = tracks[currentIndex - 1].start;
        if (audio.paused) audio.play();
      }
    });

    // Next button
    nextBtn.addEventListener('click', () => {
      let currentIndex = parseInt(songSelect.value);
      if (currentIndex < tracks.length - 1) {
        audio.currentTime = tracks[currentIndex + 1].start;
        if (audio.paused) audio.play();
      }
    });
  </script>
</body>
</html>
